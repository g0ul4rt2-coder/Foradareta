name: Noticias

# Coleta manchetes de política e eleições a cada 5 minutos e publica noticias.json no site.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Coletar manchetes
        run: python3 noticias/coletar.py noticias.json
      - name: Publicar se mudou
        run: |
          git config user.name "fora-da-reta-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "noticias: coleta automatica"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main || { git checkout --theirs noticias.json 2>/dev/null; python3 noticias/coletar.py noticias.json; git add noticias.json; GIT_EDITOR=true git rebase --continue; }
            sleep 5
          done
