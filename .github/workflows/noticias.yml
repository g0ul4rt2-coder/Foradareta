name: Noticias

# A cada 5 minutos: coleta manchetes (noticias.json) e atualiza a reserva da apuração (apuracao.json),
# usada pelo site quando o TSE limita as consultas de um visitante.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Coletar manchetes
        run: python3 noticias/coletar.py noticias.json
      - name: Atualizar a reserva da apuração
        run: python3 live/poll.py --once --out apuracao.json || true
      - name: Publicar se mudou
        run: |
          git config user.name "fora-da-reta-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FILES="noticias.json apuracao.json"
          [ -f live/historico.json ] && FILES="$FILES live/historico.json"
          git add $FILES
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "noticias e apuracao: coleta automatica"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git reset --soft origin/main
            python3 noticias/coletar.py noticias.json
            python3 live/poll.py --once --out apuracao.json || true
            git add $FILES
            git commit -m "noticias e apuracao: coleta automatica" || exit 0
            sleep 3
          done
