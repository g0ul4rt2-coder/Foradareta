name: Ao vivo

# Execução contínua para noites de apuração: coleta a cada minuto (manchetes e reserva da apuração)
# e publica no máximo a cada 6 minutos (o GitHub Pages aceita cerca de 10 publicações por hora).
on:
  workflow_dispatch:
    inputs:
      minutos:
        description: "Quanto tempo ficar ligado (minutos, até 340)"
        default: "330"

permissions:
  contents: write

concurrency:
  group: ao-vivo
  cancel-in-progress: true

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Coletar e publicar em ciclo
        env:
          MINUTOS: ${{ github.event.inputs.minutos }}
        run: |
          git config user.name "fora-da-reta-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fim=$(( $(date +%s) + ${MINUTOS:-330} * 60 ))
          ultimo=0
          while [ $(date +%s) -lt $fim ]; do
            python3 noticias/coletar.py noticias.json || true
            python3 live/poll.py --once --out apuracao.json || true
            agora=$(date +%s)
            if [ $(( agora - ultimo )) -ge 360 ]; then
              FILES="noticias.json apuracao.json"; [ -f live/historico.json ] && FILES="$FILES live/historico.json"
              git add $FILES
              if ! git diff --cached --quiet; then
                git commit -q -m "ao vivo: noticias e apuracao"
                for i in 1 2 3; do
                  git push -q && break
                  git fetch -q origin main && git rebase -q -X ours origin/main || { git rebase --abort; git reset -q --soft origin/main; git commit -q -m "ao vivo: noticias e apuracao"; }
                  sleep 3
                done
                ultimo=$agora
              fi
            fi
            sleep 60
          done
